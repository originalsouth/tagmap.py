name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel pybind11
        shell: bash

      - name: Install auditwheel (Ubuntu only)
        if: runner.os == 'Linux'
        run: pip install auditwheel

      - name: Build distribution
        run: python -m build

      - name: Repair wheels with auditwheel (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          auditwheel repair dist/tagmap-*.whl -w dist/
          rm dist/tagmap-*-linux_x86_64.whl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-temp

      - name: Consolidate distributions
        run: |
          mkdir -p dist
          find dist-temp -name "*.whl" -o -name "*.tar.gz" | while read file; do
            cp "$file" dist/
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

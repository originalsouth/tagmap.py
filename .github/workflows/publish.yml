name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel pybind11 auditwheel

      - name: Build distribution
        run: python -m build

      - name: Repair wheels with auditwheel
        run: |
          auditwheel repair dist/tagmap-*.whl -w dist/
          # Remove the original non-manylinux wheel
          rm dist/tagmap-*-linux_x86_64.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
